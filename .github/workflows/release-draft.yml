name: Release draft

# After a push to main: create or update a draft release for the version in
# manifest.json, with the matching section of CHANGELOG.md as notes and
# autoshutterscontrol.zip attached. Only when Tests and Validate succeeded for
# that commit. Publishing stays a manual step.

on:
  workflow_run:
    workflows:
      - "Tests"
      - "Validate"
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-draft
  cancel-in-progress: false

env:
  REQUIRED_CHECKS: "Tests Validate"

jobs:
  draft:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.conclusion == 'success')
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check that all checks succeeded for the commit
        id: checks
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$SHA&event=push&per_page=100" \
            --jq '.workflow_runs | sort_by(.run_started_at) | group_by(.name) | map(last) | .[] | "\(.name) \(.conclusion // .status)"')
          echo "$runs"
          ready=true
          for check in $REQUIRED_CHECKS; do
            result=$(echo "$runs" | awk -v n="$check" '$1 == n { print $2 }')
            if [ "$result" != "success" ]; then
              echo "$check: ${result:-not started}"
              ready=false
            fi
          done
          if [ "$ready" != true ] && [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "::error::Not all checks succeeded for $SHA."
            exit 1
          fi
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.checks.outputs.ready == 'true'
        with:
          ref: ${{ steps.checks.outputs.sha }}
          persist-credentials: false
      - name: Create or update the draft release
        if: steps.checks.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TARGET: ${{ steps.checks.outputs.sha }}
        run: python3 .github/scripts/release_draft.py
